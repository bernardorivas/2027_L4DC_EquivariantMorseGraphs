[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-equivariance"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy>=1.15",
    "networkx",
    "matplotlib",
]

[project.optional-dependencies]
nn = [
    "torch",
]
dev = [
    "pytest",
    "sympy",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]
