[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morsegraphs"
version = "1.0.0"
description = "Morse graphs and Conley indices of equivariant maps, computed on the orbit space with CMGDB"
requires-python = "==3.13.*"
dependencies = [
    "cmgdb==1.5.3+fork.7",
    "emlp==1.0.3",
    "objax==1.8.0",
    "jax==0.4.38",
    "jaxlib==0.4.38",
    "optax==0.2.4",
    "plum-dispatch==1.7.4",
    "numpy==2.3.5",
    "scipy==1.15.3",
    "matplotlib==3.11.2",
    "graphviz==0.21",
    "pillow==13.0.0",
]

[project.optional-dependencies]
notebooks = ["jupyterlab==4.6.6", "ipykernel==7.4.0", "nbclient==0.11.0", "nbconvert==7.17.2", "nbformat==5.11.1"]
test = ["pytest==9.2.0"]

[tool.setuptools]
packages = ["morsegraphs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
